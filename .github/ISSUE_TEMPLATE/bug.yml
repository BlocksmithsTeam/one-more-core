name: Bug
description: Something does not work as it should.
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open a restaurant\n2. ..."
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: The lines of latest.log or crash report around the problem.
      render: text
