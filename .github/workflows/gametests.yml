name: GameTests
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gametest:
    name: GameTests (${{ matrix.diegesis }} Diegesis)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diegesis: [with, without]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The GameTest server exits with the number of failed required tests, so a failure fails the job.
      - run: ./gradlew runGameTestServer ${{ matrix.diegesis == 'without' && '-PnoDiegesis' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-log-${{ matrix.diegesis }}
          path: run/logs/latest.log
